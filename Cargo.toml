[package]
name = "cali"
version = "0.3.0"
edition = "2024"
description = "A minimalist, offline-first CLI calendar"
authors = ["Martin Garcia"]
license = "MIT"
repository = "https://github.com/magarcia/cali"

[dependencies]
clap = { version = "4", features = ["derive", "suggestions"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1"
toml = "0.8"
directories = "5"
crossterm = "0.28"
inquire = "0.7"
indicatif = "0.17"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.1"
chrono-tz = "0.8"
ical = "0.11"
rrule = "0.12"
reqwest = { version = "0.12", features = ["rustls-tls"] }
fs2 = "0.4"
ctrlc = "3"
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
machine-uid = "0.5"
rand = "0.8"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "=0.6.4"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
