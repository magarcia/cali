name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Validate version matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${{ steps.extract_version.outputs.version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "Cargo.toml version: $CARGO_VERSION"
            echo "Git tag version: $TAG_VERSION"
            exit 1
          fi
          echo "Version validated: $CARGO_VERSION"

      - name: Create draft release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: v${{ steps.extract_version.outputs.version }}
          draft: true
          prerelease: false

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Linux build
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build binary
        run: cargo build --release

      - name: Create archive
        id: archive
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="cali-${VERSION}-${TARGET}.tar.gz"

          cd target/release
          tar czf "../../${ARCHIVE_NAME}" cali
          cd ../..

          # Use sha256sum for Linux, shasum for macOS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "checksum_name=${ARCHIVE_NAME}.sha256" >> $GITHUB_OUTPUT

      - name: Upload archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ steps.archive.outputs.archive_name }}
          asset_name: ${{ steps.archive.outputs.archive_name }}
          asset_content_type: application/gzip

      - name: Upload checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ steps.archive.outputs.checksum_name }}
          asset_name: ${{ steps.archive.outputs.checksum_name }}
          asset_content_type: text/plain

  update-homebrew-formula:
    name: Update Homebrew Formula
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"

          # Download release assets to get checksums
          gh release download "v${VERSION}" --dir artifacts --pattern "*.sha256"

      - name: Update formula with checksums
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"

          # Extract checksums from .sha256 files
          ARM64_MAC_SHA=$(grep "cali-${VERSION}-aarch64-apple-darwin.tar.gz" artifacts/cali-${VERSION}-aarch64-apple-darwin.tar.gz.sha256 | cut -d' ' -f1)
          INTEL_MAC_SHA=$(grep "cali-${VERSION}-x86_64-apple-darwin.tar.gz" artifacts/cali-${VERSION}-x86_64-apple-darwin.tar.gz.sha256 | cut -d' ' -f1)
          LINUX_X86_SHA=$(grep "cali-${VERSION}-x86_64-unknown-linux-musl.tar.gz" artifacts/cali-${VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256 | cut -d' ' -f1)

          # Update Formula/cali.rb
          sed -i "s/PLACEHOLDER_ARM64_SHA256/${ARM64_MAC_SHA}/" Formula/cali.rb
          sed -i "s/PLACEHOLDER_INTEL_SHA256/${INTEL_MAC_SHA}/" Formula/cali.rb
          sed -i "s/PLACEHOLDER_LINUX_X86_SHA256/${LINUX_X86_SHA}/" Formula/cali.rb

          # Also update version in formula
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Formula/cali.rb

      - name: Commit formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add Formula/cali.rb
          git commit -m "chore: update Homebrew formula for v${{ needs.create-release.outputs.version }}"
          git push origin main

  finalize:
    name: Finalize Release
    needs: [create-release, build, update-homebrew-formula]
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
            });

            const release = releases.data.find(r => r.tag_name === tag);

            if (release) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                draft: false,
              });
              console.log(`Released ${tag}`);
            }
