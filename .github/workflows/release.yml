name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Validate version matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${{ steps.extract_version.outputs.version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "Cargo.toml version: $CARGO_VERSION"
            echo "Git tag version: $TAG_VERSION"
            exit 1
          fi
          echo "Version validated: $CARGO_VERSION"

      - name: Create draft release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: v${{ steps.extract_version.outputs.version }}
          draft: true
          prerelease: false

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Create archive
        id: archive
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="cali-${VERSION}-${TARGET}.tar.gz"

          cd target/${{ matrix.target }}/release
          tar czf "../../../${ARCHIVE_NAME}" cali
          cd ../../..

          # Generate checksum
          if command -v shasum &> /dev/null; then
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "checksum_name=${ARCHIVE_NAME}.sha256" >> $GITHUB_OUTPUT

      - name: Upload archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ steps.archive.outputs.archive_name }}
          asset_name: ${{ steps.archive.outputs.archive_name }}
          asset_content_type: application/gzip

      - name: Upload checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ steps.archive.outputs.checksum_name }}
          asset_name: ${{ steps.archive.outputs.checksum_name }}
          asset_content_type: text/plain

  homebrew:
    name: Update Homebrew Formula
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download checksums
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"

          # Download all checksums
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/cali-${VERSION}-aarch64-apple-darwin.tar.gz.sha256" -o arm64.sha256
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/cali-${VERSION}-x86_64-apple-darwin.tar.gz.sha256" -o intel.sha256
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/cali-${VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256" -o linux_x86.sha256
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/cali-${VERSION}-aarch64-unknown-linux-musl.tar.gz.sha256" -o linux_arm.sha256

          # Extract just the hash (first field)
          ARM64_SHA=$(cut -d' ' -f1 arm64.sha256)
          INTEL_SHA=$(cut -d' ' -f1 intel.sha256)
          LINUX_X86_SHA=$(cut -d' ' -f1 linux_x86.sha256)
          LINUX_ARM_SHA=$(cut -d' ' -f1 linux_arm.sha256)

          echo "ARM64_SHA=${ARM64_SHA}" >> $GITHUB_ENV
          echo "INTEL_SHA=${INTEL_SHA}" >> $GITHUB_ENV
          echo "LINUX_X86_SHA=${LINUX_X86_SHA}" >> $GITHUB_ENV
          echo "LINUX_ARM_SHA=${LINUX_ARM_SHA}" >> $GITHUB_ENV

      - name: Update formula
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"

          cat > Formula/cali.rb << 'EOF'
class Cali < Formula
  desc "Calendar CLI - View your calendar events in the terminal"
  homepage "https://github.com/${{ github.repository }}"
  version "${{ needs.create-release.outputs.version }}"
  license "MIT"

  on_macos do
    if Hardware::CPU.arm?
      url "https://github.com/${{ github.repository }}/releases/download/v#{version}/cali-#{version}-aarch64-apple-darwin.tar.gz"
      sha256 "${{ env.ARM64_SHA }}"
    else
      url "https://github.com/${{ github.repository }}/releases/download/v#{version}/cali-#{version}-x86_64-apple-darwin.tar.gz"
      sha256 "${{ env.INTEL_SHA }}"
    end
  end

  on_linux do
    if Hardware::CPU.arm?
      url "https://github.com/${{ github.repository }}/releases/download/v#{version}/cali-#{version}-aarch64-unknown-linux-musl.tar.gz"
      sha256 "${{ env.LINUX_ARM_SHA }}"
    else
      url "https://github.com/${{ github.repository }}/releases/download/v#{version}/cali-#{version}-x86_64-unknown-linux-musl.tar.gz"
      sha256 "${{ env.LINUX_X86_SHA }}"
    end
  end

  def install
    bin.install "cali"
  end

  test do
    assert_match version.to_s, shell_output("#{bin}/cali --version")
  end
end
EOF

      - name: Commit and push formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cali.rb
          git commit -m "chore: update Homebrew formula to v${{ needs.create-release.outputs.version }}"
          git push origin HEAD:main

  finalize:
    name: Finalize Release
    needs: [create-release, build, homebrew]
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
            });

            const release = releases.data.find(r => r.tag_name === tag);

            if (release) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                draft: false,
              });
              console.log(`Released ${tag}`);
            }
